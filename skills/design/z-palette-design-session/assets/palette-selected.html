<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Selected Palette</title>
		<style>
			:root {
				color-scheme: light;
				--page-background: #f4f4f1;
				--page-foreground: #171714;
				--muted-foreground: #686862;
				--panel-background: #ffffff;
				--line: #d9d9d2;
				--soft-line: #e9e9e4;
				--accent: #171714;
				--radius: 18px;
				--shadow: 0 18px 60px rgb(23 23 20 / 8%);
			}

			* {
				box-sizing: border-box;
			}

			html {
				/* No elastic overscroll past the top and bottom of the page (macOS rubber-banding). */
				overscroll-behavior: none;
				background: var(--page-background);
			}

			body {
				margin: 0;
				overscroll-behavior: none;
				background:
					radial-gradient(circle at top left, rgb(99 91 255 / 8%), transparent 32rem),
					var(--page-background);
				color: var(--page-foreground);
				font-family:
					Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			.page {
				width: min(100% - 32px, 1480px);
				margin: 0 auto;
				padding: 40px 0 96px;
			}

			.page-header {
				display: flex;
				gap: 24px;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 28px;
			}

			h1,
			h2,
			h3,
			p {
				margin-top: 0;
			}

			h1 {
				margin-bottom: 0;
				font-size: clamp(2rem, 5vw, 4.5rem);
				font-weight: 780;
				letter-spacing: -0.055em;
				line-height: 0.95;
			}

			.palette-count {
				display: inline-grid;
				flex: 0 0 auto;
				grid-template-columns: 42px auto;
				gap: 11px;
				align-items: center;
				padding: 7px 16px 7px 7px;
				border-radius: 999px;
				background: var(--page-foreground);
				box-shadow: 0 8px 24px rgb(23 23 20 / 16%);
				color: #ffffff;
			}

			#palette-count-number {
				display: grid;
				width: 42px;
				height: 42px;
				place-items: center;
				border-radius: 50%;
				background: #ffffff;
				color: var(--page-foreground);
				font-size: 1rem;
				font-weight: 800;
				font-variant-numeric: tabular-nums;
			}

			.palette-count-label {
				font-size: 0.7rem;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}

			.palette-tabs {
				position: sticky;
				z-index: 20;
				top: 0;
				display: flex;
				flex-wrap: wrap;
				gap: 4px 12px;
				align-items: center;
				margin: 0 0 16px;
				padding: 4px 0;
				border-top: 1px solid var(--line);
				border-bottom: 1px solid var(--line);
				background: rgb(244 244 241 / 88%);
				backdrop-filter: blur(18px);
			}

			.palette-tabs-list {
				display: flex;
				gap: 8px;
				overflow-x: auto;
				scrollbar-width: none;
			}

			.palette-tabs-list::-webkit-scrollbar {
				display: none;
			}

			.palette-tab {
				flex: 0 0 auto;
				padding: 2px 9px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgb(255 255 255 / 72%);
				color: var(--page-foreground);
				font-size: 0.68rem;
				font-weight: 720;
				letter-spacing: 0.02em;
				text-decoration: none;
				transition:
					border-color 160ms ease,
					background 160ms ease;
			}

			.palette-tab:hover,
			.palette-tab:focus-visible {
				border-color: var(--page-foreground);
				background: #ffffff;
				outline: none;
			}

			.palette-section {
				margin-top: 72px;
				padding-top: 32px;
				border-top: 1px solid var(--line);
				scroll-margin-top: 40px;
			}

			.palette-section:first-child {
				margin-top: 0;
			}

			.palette-heading {
				display: flex;
				flex-wrap: wrap;
				gap: 20px;
				align-items: end;
				justify-content: space-between;
				margin-bottom: 24px;
			}

			.palette-heading h2 {
				margin-bottom: 6px;
				font-size: clamp(2rem, 4vw, 3.6rem);
				letter-spacing: -0.045em;
				line-height: 1;
			}

			.palette-heading p {
				margin-bottom: 0;
				color: var(--muted-foreground);
			}

			.seed {
				display: inline-flex;
				gap: 10px;
				align-items: center;
				padding: 9px 12px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgb(255 255 255 / 72%);
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.78rem;
				font-weight: 700;
			}

			.seed-swatch {
				width: 13px;
				height: 13px;
				border: 1px solid rgb(0 0 0 / 12%);
				border-radius: 50%;
				background: var(--seed-color);
			}

			.background-details {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
				margin-bottom: 14px;
			}

			.background-details-label {
				margin-right: 4px;
				color: var(--muted-foreground);
				font-size: 0.7rem;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}

			.background-badge {
				display: inline-flex;
				gap: 9px;
				align-items: center;
				padding: 7px 10px 7px 7px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgb(255 255 255 / 78%);
				font-size: 0.72rem;
				font-weight: 680;
			}

			.background-swatch {
				width: 22px;
				height: 22px;
				border: 1px solid rgb(0 0 0 / 14%);
				border-radius: 50%;
				background: var(--background-color);
			}

			.background-mode {
				color: var(--muted-foreground);
				text-transform: uppercase;
			}

			.background-value {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-weight: 760;
			}

			.background-lightness {
				padding-left: 9px;
				border-left: 1px solid var(--line);
				color: var(--muted-foreground);
			}

			.ramp-table-group {
				margin-top: 34px;
			}

			.ramp-table-header {
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 12px;
			}

			.ramp-table-header h3 {
				margin-bottom: 0;
				font-size: 1.15rem;
				letter-spacing: -0.02em;
			}

			.table-shell {
				overflow-x: auto;
				border: 1px solid var(--line);
				border-radius: var(--radius);
				background: var(--panel-background);
				box-shadow: var(--shadow);
			}

			table {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0;
				table-layout: fixed;
			}

			.ramp-table {
				min-width: 1120px;
			}

			th,
			td {
				border-right: 1px solid var(--soft-line);
				border-bottom: 1px solid var(--soft-line);
			}

			th:last-child,
			td:last-child {
				border-right: 0;
			}

			tr:last-child td {
				border-bottom: 0;
			}

			th {
				height: 70px;
				padding: 12px 10px;
				background: #f8f8f5;
				color: #555550;
				font-size: 0.68rem;
				font-weight: 760;
				letter-spacing: 0.07em;
				line-height: 1.3;
				text-align: center;
				text-transform: uppercase;
			}

			th:first-child {
				width: 62px;
			}

			th.color-column {
				width: 118px;
			}

			th.contrast-column {
				width: 104px;
			}

			th small {
				font-weight: 600;
				letter-spacing: 0;
				opacity: 0.7;
				text-transform: none;
			}

			td {
				height: 58px;
				padding: 0;
				background: #fff;
				font-variant-numeric: tabular-nums;
			}

			.step,
			.contrast,
			.swatch {
				text-align: center;
			}

			.step {
				color: var(--muted-foreground);
				font-size: 0.76rem;
				font-weight: 760;
			}

			.swatch {
				padding: 10px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.78rem;
				font-weight: 760;
				letter-spacing: 0.025em;
				text-shadow: 0 1px 1px rgb(0 0 0 / 10%);
			}

			.swatch.is-alpha {
				font-size: 0.68rem;
				letter-spacing: 0;
			}

			.swatch.is-wide {
				min-width: 240px;
				padding: 8px 6px;
				font-size: 0.62rem;
				line-height: 1.35;
				letter-spacing: 0;
				white-space: normal;
				word-break: break-word;
			}

			.contrast {
				color: #4e4e49;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.75rem;
				font-weight: 650;
			}

			.examples {
				margin-top: 16px;
				padding: 12px;
				border: 1px solid var(--line);
				border-radius: var(--radius);
				background: rgb(255 255 255 / 56%);
			}

			.examples-header {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: baseline;
				justify-content: space-between;
				margin-bottom: 8px;
			}

			.examples-header h3 {
				margin-bottom: 0;
				font-size: 1.25rem;
				letter-spacing: -0.02em;
			}

			.examples-header p {
				margin-bottom: 0;
				color: var(--muted-foreground);
				font-size: 0.85rem;
			}

			.mode-examples {
				display: grid;
				gap: 10px;
			}

			.mode-group {
				display: grid;
				gap: 8px;
				padding-top: 8px;
				border-top: 1px solid var(--soft-line);
			}

			.mode-label {
				color: var(--muted-foreground);
				font-size: 0.7rem;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}

			.screen-grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
			}

			.mockup-placeholder {
				display: grid;
				min-height: 210px;
				padding: 22px;
				place-content: center;
				border: 1px dashed #aaa9a1;
				border-radius: 14px;
				background:
					linear-gradient(135deg, rgb(255 255 255 / 84%), rgb(244 244 241 / 76%));
				color: #666660;
				text-align: center;
			}

			.mockup-placeholder[data-mode="dark"] {
				border-color: #52524e;
				background: linear-gradient(135deg, #20201e, #121211);
				color: #bcbcb4;
			}

			.mockup-placeholder strong {
				display: block;
				margin: 8px 0;
				color: inherit;
				font-size: 0.92rem;
			}

			.mockup-placeholder code {
				color: inherit;
				font-size: 0.66rem;
				line-height: 1.5;
			}


			/*==================================================
			  Session additions: scheme switcher, token tables, mockups
			==================================================*/

			.page-intro {
				max-width: 900px;
				margin: -8px 0 28px;
				color: var(--muted-foreground);
				line-height: 1.55;
			}

			.scheme-bar {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 10px;
				align-items: center;
			}

			.scheme-bar-label {
				color: var(--muted-foreground);
				font-size: 0.7rem;
				font-weight: 760;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}

			.scheme-buttons {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}

			.scheme-button {
				padding: 8px 13px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgb(255 255 255 / 72%);
				color: var(--page-foreground);
				font: inherit;
				font-size: 0.76rem;
				font-weight: 720;
				cursor: pointer;
			}

			.scheme-button[aria-pressed="true"] {
				border-color: var(--page-foreground);
				background: var(--page-foreground);
				color: #ffffff;
			}

			.scheme-button:focus-visible {
				outline: 2px solid #635bff;
				outline-offset: 2px;
			}

			.overview {
				margin-bottom: 56px;
			}

			.overview h2 {
				margin-bottom: 8px;
				font-size: clamp(1.6rem, 3vw, 2.4rem);
				letter-spacing: -0.04em;
			}

			.overview > p {
				max-width: 900px;
				color: var(--muted-foreground);
				line-height: 1.55;
			}

			.scheme-cards {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
				gap: 12px;
				margin: 22px 0 28px;
			}

			.scheme-card {
				padding: 18px;
				border: 1px solid var(--line);
				border-radius: 14px;
				background: var(--panel-background);
				cursor: pointer;
				text-align: left;
				font: inherit;
				color: inherit;
			}

			.scheme-card[aria-pressed="true"] {
				border-color: var(--page-foreground);
				box-shadow: inset 0 0 0 1px var(--page-foreground);
			}

			.hue-meter {
				height: 6px;
				margin: 6px 0 8px;
				overflow: hidden;
				border-radius: 999px;
				background: var(--soft-line);
			}

			.hue-meter span {
				display: block;
				height: 100%;
				border-radius: inherit;
				background: linear-gradient(90deg, #8a8a84, #635bff);
			}

			.status-badge {
				display: inline-block;
				margin-bottom: 8px;
				padding: 2px 8px;
				border-radius: 999px;
				font-size: 0.64rem;
				font-weight: 760;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}

			.status-badge.selected {
				background: #e3f5e8;
				color: #1d6b38;
			}

			.status-badge.candidate {
				background: #eef0ff;
				color: #3d3aa8;
			}

			.scheme-card h3 {
				margin-bottom: 4px;
				font-size: 1rem;
				letter-spacing: -0.01em;
			}

			.scheme-card .influences {
				margin-bottom: 10px;
				color: var(--muted-foreground);
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}

			.scheme-card p {
				margin-bottom: 0;
				font-size: 0.84rem;
				line-height: 1.5;
			}

			.matrix-shell {
				overflow-x: auto;
				border: 1px solid var(--line);
				border-radius: var(--radius);
				background: var(--panel-background);
				box-shadow: var(--shadow);
			}

			.matrix {
				min-width: 980px;
				table-layout: auto;
			}

			.matrix th,
			.matrix td {
				height: auto;
				padding: 7px 10px;
				font-size: 0.74rem;
				text-align: left;
			}

			.matrix th {
				position: sticky;
				top: 0;
			}

			.matrix td {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			}

			.matrix td:first-child {
				font-weight: 700;
			}

			.matrix .group-row td {
				background: #f8f8f5;
				color: var(--muted-foreground);
				font-family: inherit;
				font-size: 0.66rem;
				font-weight: 760;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.matrix .is-selected {
				background: #f1f0ff;
			}

			.matrix .ref-pair {
				white-space: nowrap;
			}

			.matrix .ref-pair span {
				color: var(--muted-foreground);
			}

			.matrix .ref-pair.ref-color {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.74rem;
			}

			.matrix .ref-pair.ref-color b {
				margin-right: 8px;
				font-weight: 760;
			}

			.matrix .ref-pair.ref-color .ref-hex,
			.matrix .ref-pair.ref-color .ref-alpha {
				color: inherit;
				opacity: 0.78;
			}

			.matrix .ref-pair.ref-color .ref-alpha {
				margin-left: 8px;
				font-size: 0.66rem;
			}

			.score-grid td {
				text-align: center;
			}

			.score {
				display: inline-block;
				min-width: 64px;
				padding: 3px 8px;
				border-radius: 999px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.72rem;
				font-weight: 760;
			}

			.score.good {
				background: #e3f5e8;
				color: #1d6b38;
			}

			.score.ok {
				background: #fff3d1;
				color: #7a5500;
			}

			.score.bad {
				background: #ffe3e1;
				color: #a3261f;
			}

			.overview-subhead {
				margin: 30px 0 10px;
				font-size: 1.05rem;
				letter-spacing: -0.01em;
			}

			.token-table-shell {
				margin-top: 34px;
			}

			.token-table {
				min-width: 1444px;
			}

			.token-table th,
			.token-table td {
				height: auto;
				padding: 7px 10px;
				font-size: 0.75rem;
			}

			.token-table .token-name {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-weight: 700;
				text-align: left;
			}

			.token-table .token-name-head {
				width: 190px;
				text-align: left;
			}

			.token-table .mode-head {
				height: 34px;
				background: #efeee9;
				color: var(--page-foreground);
				letter-spacing: 0.12em;
			}

			.token-table .token-fill-head {
				width: 172px;
			}

			.token-table .cx-head {
				width: 96px;
			}

			.token-table thead th,
			.ramp-table thead th {
				padding: 8px 5px;
				font-size: 0.6rem;
				letter-spacing: 0.02em;
			}

			.token-table .token-fill {
				padding: 7px 6px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.66rem;
				font-weight: 760;
				text-align: center;
				white-space: nowrap;
			}

			.token-table .group-row td {
				background: #f8f8f5;
				color: var(--muted-foreground);
				font-family: inherit;
				font-size: 0.66rem;
				font-weight: 760;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.token-cell {
				display: flex;
				gap: 8px;
				align-items: center;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			}

			.token-swatch {
				flex: 0 0 auto;
				width: 22px;
				height: 22px;
				border: 1px solid rgb(0 0 0 / 14%);
				border-radius: 6px;
			}

			.token-ref {
				min-width: 30px;
				font-weight: 760;
			}

			.token-hex {
				color: var(--muted-foreground);
			}

			.contrast .cx-sep,
			.cx .cx-sep {
				margin: 0 4px;
				color: #b9b8b0;
			}

			.cx {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.7rem;
				font-weight: 650;
				text-align: center;
				white-space: nowrap;
			}

			.cx .good {
				color: #15803d;
			}

			.cx .ok {
				color: #a16207;
			}

			.cx .bad {
				color: #b91c1c;
				font-weight: 800;
			}

			.cx-empty {
				color: #b9b8b0;
			}

			.cx-legend {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 16px;
				align-items: center;
				margin: 0 0 10px;
				font-size: 0.72rem;
			}

			.cx-legend-title {
				color: var(--muted-foreground);
				font-weight: 760;
			}

			.cx-legend-item b {
				margin-right: 4px;
			}

			.cx-legend-item span {
				margin-right: 6px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-weight: 700;
			}

			.cx-legend .good {
				color: #15803d;
			}

			.cx-legend .ok {
				color: #a16207;
			}

			.cx-legend .bad {
				color: #b91c1c;
			}

			.check {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.72rem;
				white-space: nowrap;
			}

			.check.pass {
				color: #1d6b38;
			}

			.check.fail {

			/*----- Mockups: everything below reads only token variables -----*/

			.mock {

			.mock .kbd {

				border-radius: var(--radius-sm);

				white-space: nowrap;

			.mock .btn-primary {
				background: var(--primary);

			}

			.mock .btn-secondary {
				background: var(--secondary);
				color: var(--secondary-foreground);

			.mock .btn-outline {

			.mock .btn-destructive {

			.mock .btn.is-open,

			.mock .badge {
				display: inline-flex;
				gap: 3px;
				align-items: center;
				padding: 1px 6px;
				border-radius: 999px;
				font-size: 10px;
				font-weight: 650;

			.mock .badge-success {
				background: var(--success-fill);

			}

			.mock .badge-warning {
				background: var(--warning-fill);
				color: var(--warning-fill-foreground);
			}

			.mock .badge-destructive {
				background: var(--destructive-fill);

			}

			.mock .badge-primary {

			.mock .badge-muted {

			.mock .text-muted {

			.mock .icon {

				height: 14px;

				font-size: 11px;

				<div>

			const literalRefs = { white: "#FFFFFF", black: "#000000" };

			// Returns the CSS value of a ref: six-digit HEX, or eight-digit HEX for an alpha step.
			const stepHex = (palette, ref, mode, token) => {
				if (ref === "seed") return palette.seed;
				if (ref === "on-seed") return palette.onSeed;
				if (ref === "selected-background") return palette.backgrounds[mode].color;
				if (literalRefs[ref]) return literalRefs[ref];
				const [, ramp, alpha, step] = /^([BNS])(A?)(\d+)$/.exec(ref);
				const index = Number(step) - 1;
				const ramps = alpha ? palette.alphaRamps : palette.ramps;
				if (ramp === "B") return ramps[`${mode}Brand`][index];
				if (ramp === "N") return ramps[`${mode}Neutral`][index];
				const signal = palette.signals.find((item) => item.key === signalKeyOf(token));
				return (alpha ? signal.alphaRamps : signal.ramps)[mode][index];
			};

			// Alpha compositing. overHex paints a CSS HEX value (6 or 8 digits) over an opaque
			// ground and returns the opaque six-digit result; opaque colors come back unchanged.
			const hexChannels = (hex) => {
				let value = hex.slice(1);
				if (value.length === 3 || value.length === 4) value = [...value].map((char) => char + char).join("");
				const channel = (offset) => Number.parseInt(value.slice(offset, offset + 2), 16);
				return { r: channel(0), g: channel(2), b: channel(4), a: value.length >= 8 ? channel(6) / 255 : 1 };
			};

			const overHex = (css, ground) => {
				const color = hexChannels(css);
				if (color.a === 1) return css.slice(0, 7).toUpperCase();
				const base = hexChannels(ground);
				const byte = (fg, bg) =>
					Math.min(255, Math.max(0, Math.round(fg * color.a + bg * (1 - color.a))))
						.toString(16)
						.padStart(2, "0");
				return `#${byte(color.r, base.r)}${byte(color.g, base.g)}${byte(color.b, base.b)}`.toUpperCase();
			};

			// The surface an alpha token is painted on in the mockups. Text sits on its fill
			// (secondary-foreground on secondary); sidebar tokens on the sidebar; everything else on
			// the page background. Contrast checks paint a token over whatever it is measured against.
			const groundOf = (token, tokens) => {
				if (token === "background") return null;
				if (token.endsWith("-foreground") && token !== "foreground") {
					const fill = token.replace(/-foreground$/, "");
					if (tokens.includes(fill)) return fill;
				}
				if (token.startsWith("sidebar") && token !== "sidebar") return "sidebar";
				return "background";
			};

			// Pure black or white text for a fill: whichever passes WCAG 4.5:1 and APCA Lc 60;
			// if both pass, the higher APCA wins.
			const blackOrWhite = (fillHex) => {
				const options = ["white", "black"].map((name) => ({
					name,
					wcag: contrast(literalRefs[name], fillHex),
					lc: apca(literalRefs[name], fillHex),
				}));
				const passing = options.filter((option) => option.wcag >= TEXT && option.lc >= BUTTON_LC);
				return (passing.length > 0 ? passing : options).sort((a, b) => b.lc - a.lc)[0].name;
			};

			// Text on the seed (on-seed): white, or light neutral step 12.
			palette.onSeed = onSeedText(palette);

			// Each token resolves to { ref, css, hex }. css is what the mockups paint (eight-digit
			// HEX for alpha steps); hex is the opaque color seen on the token's ground (groundOf).
			// "black-or-white" resolves against the token's fill (the same token name without
			// "-foreground"), as seen on that fill's ground.
			const resolveScheme = (palette, scheme, mode) => {
				const resolved = {};
				const tokens = Object.keys(scheme.tokens);
				const resolve = (token) => {
					if (resolved[token]) return resolved[token];
					const ground = groundOf(token, tokens);
					const groundHex = ground ? resolve(ground).hex : palette.backgrounds[mode].color;
					let ref = modeRef(scheme, token, mode);
					let css;
					if (ref === "black-or-white") {
						ref = blackOrWhite(resolve(token.replace(/-foreground$/, "")).hex);
						css = literalRefs[ref];
					} else {
						css = stepHex(palette, ref, mode, token);
					}
					resolved[token] = { ref, css, hex: overHex(css, groundHex) };
					return resolved[token];
				};
				for (const token of tokens) resolve(token);
				return resolved;
			};

			const resolveTokens = (palette, scheme, mode) =>
				Object.fromEntries(
					Object.entries(resolveScheme(palette, scheme, mode)).map(([token, { hex }]) => [token, hex]),
				);

			// CSS values for the mockups (alpha steps stay see-through).
			const resolveCss = (palette, scheme, mode) =>
				Object.fromEntries(
					Object.entries(resolveScheme(palette, scheme, mode)).map(([token, { css }]) => [token, css]),
				);

			// resolved: resolveScheme output. An alpha token is painted over the color it is
			// measured against.
			const runChecks = (resolved, mode = "dark") => {
				const results = {};
				for (const [token, checks] of Object.entries(tokenChecks)) {
					results[token] = checks.map(([against, minimum, apcaMinimum]) => {
						const ground = resolved[against].hex;
						const color = overHex(resolved[token].css, ground);
						const ratio = contrast(color, ground);
						const lc = apca(color, ground);
						return {
							against,
							minimum,
							apcaMinimum,
							ratio,
							lc,
							pass: minimum === null ? null : ratio >= minimum && (!apcaMinimum || lc >= apcaMinimum),
						};
					});
				}
				return results;
			};

			//==================================================
			// Ramp Tables
			//==================================================

			// Each contrast cell shows "WCAG 2 ratio | APCA Lc". Steps are measured as text on the
			// mode background and on brand step 2; black and white are measured as text on the step.
			const formatPair = (ratio, lc) =>
				`<span class="cx-v2">${ratio.toFixed(2)}</span><span class="cx-sep">|</span><span class="cx-v3">${Math.round(lc)}</span>`;

			const renderRampTable = ({ title, seed, backgrounds, columns, tableClass, kind = "solid" }) => {
				const rgb = (hex) => {
					let value = hex.slice(1);
					if (value.length === 3 || value.length === 4) value = [...value].map((char) => char + char).join("");
					const channel = (offset) => Number.parseInt(value.slice(offset, offset + 2), 16);
					return {
						r: channel(0),
						g: channel(2),
						b: channel(4),
						a: value.length >= 8 ? channel(6) / 255 : 1,
					};
				};
				const compositeHex = (color, ground) => {
					const foreground = rgb(color);
					const background = rgb(ground);
					const blend = (fg, bg) => Math.round(bg * (1 - foreground.a)) + Math.round(fg * foreground.a);
					const byte = (n) => Math.min(255, Math.max(0, n)).toString(16).padStart(2, "0");
					return `#${byte(blend(foreground.r, background.r))}${byte(blend(foreground.g, background.g))}${byte(blend(foreground.b, background.b))}`.toUpperCase();
				};
				const textOn = (color, ground) => {
					if (color.startsWith("#")) {
						const hex = compositeHex(color, ground);
						return contrast(hex, "#000000") >= contrast(hex, "#FFFFFF") ? "#000000" : "#FFFFFF";
					}
					if (/oklch\(|display-p3/i.test(color)) {
						const lum = lumOf(color, ground);
						return ratioOfLum(lum, lumHex("#000000")) >= ratioOfLum(lum, lumHex("#FFFFFF")) ? "#000000" : "#FFFFFF";
					}
					const oklch = color.match(/oklch\(\s*([\d.]+)%/i);
					if (oklch) return Number(oklch[1]) >= 65 ? "#000000" : "#FFFFFF";
					const p3 = color.match(/color\(display-p3\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+))?\)/i);
					if (p3) {
						const alpha = p3[4] === undefined ? 1 : Number(p3[4]);
						const y = 0.2126 * Number(p3[1]) + 0.7152 * Number(p3[2]) + 0.0722 * Number(p3[3]);
						const blended = luminance(ground) * (1 - alpha) + y * alpha;
						return blended > 0.35 ? "#000000" : "#FFFFFF";
					}
					return "#111111";
				};
				// Every table shows contrast. Each step is measured through lumOf: alpha steps composited
				// over the mode background, wide gamut steps converted to display-p3 first.
				const showContrast = true;
				const measures = [
					["vs. background", (lum, column) => [ratioOfLum(lum, lumHex(column.background)), apcaFromY(lum.ya, apcaY(column.background))]],
					["vs. brand step 2", (lum, column) => [ratioOfLum(lum, lumHex(column.brandStep2)), apcaFromY(lum.ya, apcaY(column.brandStep2))]],
					["vs. black", (lum) => [ratioOfLum(lum, lumHex("#000000")), apcaFromY(apcaY("#000000"), lum.ya)]],
					["vs. white", (lum) => [ratioOfLum(lum, lumHex("#FFFFFF")), apcaFromY(apcaY("#FFFFFF"), lum.ya)]],
				];
				const headers = columns
					.map(
						(column) => `
							<th class="color-column">${column.label}</th>
							${showContrast ? measures.map(([label]) => `<th class="contrast-column">${label}<br /><small>v2 | v3</small></th>`).join("") : ""}
						`,
					)
					.join("");
				const rows = Array.from({ length: 12 }, (_, index) => {
					const renderedCells = columns
						.map((column) => {
							const color = column.values[index];
							const measured = color.startsWith("#") ? lumHex(compositeHex(color, column.background)) : lumOf(color, column.background);
							const textColor = textOn(color, column.background);
							const swatchClass = kind === "solid" ? "swatch" : `swatch is-${kind}`;
							return `
								<td class="${swatchClass}" style="background:linear-gradient(${color}, ${color}), ${column.background};color:${textColor}">${color}</td>
								${showContrast ? measures.map(([, measure]) => `<td class="contrast">${formatPair(...measure(measured, column))}</td>`).join("") : ""}
							`;
						})
						.join("");
					return `<tr><td class="step">${index + 1}</td>${renderedCells}</tr>`;
				}).join("");
				const seedBadge = seed
					? `<span class="seed" style="--seed-color:${seed}"><span class="seed-swatch" aria-hidden="true"></span>Seed ${seed}</span>`
					: "";

				return `
					<div class="ramp-table-group">
						<div class="ramp-table-header">
							<h3>${title}</h3>
							${seedBadge}
						</div>
						<div class="background-details">
							<span class="background-details-label">Background colors</span>
							${["light", "dark"]
								.map(
									(mode) => `
								<span class="background-badge">
									<span class="background-swatch" style="--background-color:${backgrounds[mode].color}" aria-hidden="true"></span>
									<span class="background-mode">${mode}</span>
									<span class="background-value">${backgrounds[mode].color}</span>
									<span class="background-lightness">OKLCH lightness ${backgrounds[mode].lightness}</span>
								</span>`,
								)
								.join("")}
						</div>
						<div class="table-shell">
							<table class="${tableClass}">
								<thead><tr><th>Step</th>${headers}</tr></thead>
								<tbody>${rows}</tbody>
							</table>
						</div>
					</div>
				`;
			};

			const rampColumns = (values, palette, backgrounds) =>
				["light", "dark"].map((mode) => ({
					label: mode === "light" ? "Light" : "Dark",
					values: values[mode],
					background: backgrounds[mode].color,
					brandStep2: palette.ramps[`${mode}Brand`][1],
				}));

			//==================================================
			// Token Table
			//==================================================

			// Contrast colour coding by token role. Each value is green at or above the first
			// threshold, yellow at or above the second, red below. Pairing cells always use the
			// text scale because they measure text on its surface.
			const contrastScales = {
				text: { v2: [4.5, 3], v3: [75, 60], label: "Text" },
				nonText: { v2: [3, 2], v3: [45, 30], label: "UI marks (input, ring, primary, chart)" },
				border: { v2: [1.5, 1.2], v3: [20, 10], label: "Borders" },
				surface: { v2: [1.15, 1.03], v3: [10, 4], label: "Surfaces and fills" },
			};

			const tokenRole = (token) => {
				if (["input", "ring", "sidebar-ring", "chart-primary", "primary", "sidebar-primary"].includes(token)) return "nonText";
				if (["border", "sidebar-border"].includes(token)) return "border";
				if (token === "foreground" || token.endsWith("-foreground") || ["destructive", "warning", "success"].includes(token))
					return "text";
				return "surface";
			};

			// Specific pairs: each surface with the text that sits on it.
			const pairOf = { background: "foreground", foreground: "background" };
			for (const token of tokenGroups.flatMap((group) => group.tokens)) {
				if (token === "foreground" || !token.endsWith("-foreground")) continue;
				const surface = token.replace(/-foreground$/, "");
				pairOf[token] = surface;
				pairOf[surface] = token;
			}

			const tone = (value, [good, ok]) => (value >= good ? "good" : value >= ok ? "ok" : "bad");

			const contrastCell = (textHex, backgroundHex, role) => {
				const scale = contrastScales[role];
				const ratio = contrast(textHex, backgroundHex);
				const lc = apca(textHex, backgroundHex);
				return `<td class="cx"><span class="cx-v2 ${tone(ratio, scale.v2)}">${ratio.toFixed(2)}</span><span class="cx-sep">|</span><span class="cx-v3 ${tone(lc, scale.v3)}">${Math.round(lc)}</span></td>`;
			};

			const emptyCell = `<td class="cx cx-empty">—</td>`;
			const comparisonTokens = ["background", "card", "popover", "sidebar"];

			const renderContrastLegend = () =>
				`<div class="cx-legend">
					<span class="cx-legend-title">Each cell: WCAG 2 ratio | APCA Lc</span>
					${Object.values(contrastScales)
						.map(
							(scale) =>
								`<span class="cx-legend-item"><b>${scale.label}</b> <span class="good">≥ ${scale.v2[0]} | ${scale.v3[0]}</span> <span class="ok">≥ ${scale.v2[1]} | ${scale.v3[1]}</span> <span class="bad">below</span></span>`,
						)
						.join("")}
				</div>`;

			const renderTokenTable = (palette, scheme) => {
				const byMode = Object.fromEntries(["light", "dark"].map((mode) => [mode, resolveScheme(palette, scheme, mode)]));
				const modeCells = (token, mode) => {
					const resolved = byMode[mode];
					const { hex, css, ref } = resolved[token];
					const role = tokenRole(token);
					const textColor = contrast(hex, "#000000") >= contrast(hex, "#FFFFFF") ? "#000000" : "#FFFFFF";
					const comparisons = comparisonTokens
						// Alpha tokens are painted over each surface they are compared with.
						.map((against) =>
							against === token ? emptyCell : contrastCell(overHex(css, resolved[against].hex), resolved[against].hex, role),
						)
						.join("");
					const pair = pairOf[token];
					let pairing = emptyCell;
					if (pair && resolved[pair]) {
						const [text, surface] =
							tokenRole(token) === "text"
								? [overHex(css, resolved[pair].hex), resolved[pair].hex]
								: [overHex(resolved[pair].css, hex), hex];
						pairing = contrastCell(text, surface, "text").replace(
							'<td class="cx">',
							`<td class="cx" title="${token} vs ${pair}">`,
						);
					}
					const alphaNote = css.length > 7 ? ` title="alpha ${css}, shown on ${groundOf(token, Object.keys(resolved))}"` : "";
					return `<td class="token-fill" style="background:${hex};color:${textColor}"${alphaNote}>${ref} - ${hex}</td>${comparisons}${pairing}`;
				};
				const columnHeads = ["Color", "vs. background", "vs. card", "vs. popover", "vs. sidebar", "vs. pairing"]
					.map((label, index) => `<th class="${index === 0 ? "token-fill-head" : "cx-head"}">${label}</th>`)
					.join("");
				const rows = tokenGroups
					.map((group) => {
						const groupRows = group.tokens
							.map((token) => `<tr><td class="token-name">${token}</td>${modeCells(token, "light")}${modeCells(token, "dark")}</tr>`)
							.join("");
						return `<tr class="group-row"><td colspan="13">${group.label}</td></tr>${groupRows}`;
					})
					.join("");
				return `
					${renderContrastLegend()}
					<div class="table-shell">
						<table class="token-table">
							<colgroup>
								<col style="width:164px" />
								${'<col style="width:160px" /><col style="width:96px" /><col style="width:96px" /><col style="width:96px" /><col style="width:96px" /><col style="width:96px" />'.repeat(2)}
							</colgroup>
							<thead>
								<tr><th rowspan="2" class="token-name-head">Token</th><th colspan="6" class="mode-head">Light</th><th colspan="6" class="mode-head">Dark</th></tr>
								<tr>${columnHeads}${columnHeads}</tr>
							</thead>
							<tbody>${rows}</tbody>
						</table>
					</div>`;
			};

			//==================================================
			// Mockups
			//==================================================

			const cssVars = (tokens, mode) =>
				Object.entries(tokens)
					.map(([token, hex]) => `--${token}:${hex}`)
					.concat(
						`--mock-shadow:${
							mode === "light"
								? "0 1px 2px rgb(0 0 0 / 6%), 0 12px 32px rgb(0 0 0 / 10%)"
								: "0 1px 2px rgb(0 0 0 / 40%), 0 16px 40px rgb(0 0 0 / 55%)"
						}`,
					)
					.join(";");

			const bars = [38, 52, 44, 68, 57, 81, 63, 92, 74, 86, 70, 97];

			const webMockup = () => `
				<div class="mock web-app" data-tok="background foreground border">
					<aside class="web-sidebar" data-tok="sidebar sidebar-foreground sidebar-border">
						<div class="web-workspace" data-tok="sidebar-foreground"><span class="web-logo" data-tok="sidebar-primary sidebar-primary-foreground">A</span>Acme Inc</div>

						<div class="sb-item" data-tok="sidebar-foreground"><span class="icon">●</span>Engineering</div>
						<div class="sb-footer" data-tok="sidebar-foreground sidebar-border"><span class="avatar" data-tok="secondary secondary-foreground">JD</span>Jo Doe</div>
					</aside>
					<div class="web-main">
						<div class="web-top" data-tok="border">
							<h4 data-tok="foreground">Dashboard</h4>
							<div class="search" data-tok="background input muted-foreground"><span class="icon">⌕</span>Search<span class="kbd" data-tok="muted muted-foreground border">⌘K</span></div>
							<button class="btn btn-secondary" data-tok="secondary secondary-foreground">Export</button>
							<button class="btn btn-primary" data-tok="primary primary-foreground">Create report</button>
						</div>
						<div class="banner" data-tok="warning-fill warning-fill-foreground"><span class="icon">⚠</span>Your trial ends in 3 days.<span class="banner-link">Upgrade</span></div>
						<div class="stats">
							<div class="card stat" data-tok="card card-foreground border">
								<div class="stat-label" data-tok="muted-foreground">Revenue</div>
								<div class="stat-value" data-tok="card-foreground">$48.2k <span class="badge badge-success" data-tok="success-fill success-fill-foreground">▲ 12.4%</span></div>
								<div class="stat-note" data-tok="success">On track for Q3 target</div>
							</div>
							<div class="card stat" data-tok="card card-foreground border">
								<div class="stat-label" data-tok="muted-foreground">Active users</div>
								<div class="stat-value" data-tok="card-foreground">2,318 <span class="badge badge-muted" data-tok="muted muted-foreground">0.0%</span></div>

									<div class="row is-hover" data-tok="accent accent-foreground border"><span>Globex Corp</span><span class="badge badge-warning" data-tok="warning-fill warning-fill-foreground">Due</span><span class="row-amount">$1.2k</span></div>
									<div class="row" data-tok="border card-foreground"><span>Initech</span><span class="badge badge-destructive" data-tok="destructive-fill destructive-fill-foreground">Overdue</span><span class="row-amount">$310</span></div>
									<div class="row" data-tok="card-foreground"><span>Umbrella</span><span class="badge badge-muted" data-tok="muted muted-foreground">Draft</span><span class="row-amount">$95</span></div>
								</div>
							</div>
						</div>
					</div>
				</div>`;

			const mobileMockup = () => `
				<div class="mock phone" data-tok="background foreground border">
					<div class="phone-status" data-tok="foreground"><span>9:41</span><span>●●● ▮</span></div>
					<div class="phone-body">
						<div class="phone-head">
							<div><h4 data-tok="foreground">Good morning</h4><p data-tok="muted-foreground">Here's your week at a glance</p></div>
							<span class="avatar" data-tok="secondary secondary-foreground">JD</span>
						</div>
						<div class="segmented" data-tok="muted muted-foreground"><span class="is-on" data-tok="background foreground">Week</span><span>Month</span><span>Year</span></div>
						<div class="card goal" data-tok="card card-foreground border">
							<div class="goal-top" data-tok="card-foreground">Savings goal <span>68%</span></div>
							<div class="progress" data-tok="muted"><i data-tok="chart-primary"></i></div>
							<div class="text-muted" data-tok="muted-foreground">$3,400 of $5,000 · 21 days left</div>
						</div>
						<div class="toast" data-tok="success-fill success-fill-foreground"><span class="icon">✓</span>Transfer of $250 sent</div>
						<div class="field">
							<label data-tok="foreground">Recipient</label>
							<div class="input is-placeholder" data-tok="background input muted-foreground">Name or email</div>
						</div>
						<div class="field">
							<label data-tok="foreground">Amount</label>
							<div class="input is-focus" data-tok="background foreground ring">$ 1,200.00</div>
							<div class="field-warning" data-tok="warning">Transfers over $1,000 need approval</div>
						</div>
						<div class="field">
							<label data-tok="foreground">Reference</label>
							<div class="input is-error" data-tok="background foreground destructive">INV-10</div>
							<div class="field-error" data-tok="destructive">Reference must be 8 characters</div>
						</div>
						<div class="alert" data-tok="destructive-fill destructive-fill-foreground"><span class="icon">!</span><div><strong>Card declined</strong><span>Update your payment method to continue.</span></div></div>
						<div class="phone-actions">
							<button class="btn btn-primary" data-tok="primary primary-foreground">Send money</button>
							<button class="btn btn-secondary" data-tok="secondary secondary-foreground">Save draft</button>
							<button class="btn btn-destructive" data-tok="destructive-fill destructive-fill-foreground">Cancel</button>
						</div>
					</div>
					<div class="tabbar" data-tok="card border muted-foreground">
						<span class="is-on" data-tok="foreground"><b data-tok="foreground"></b>Home</span><span><b data-tok="muted"></b>Cards</span><span><b data-tok="muted"></b>Pay</span><span><b data-tok="muted"></b>Me</span>
					</div>
				</div>`;

			const renderLegend = (palette, scheme, mode) => {
				const resolved = resolveScheme(palette, scheme, mode);
				return tokenGroups
					.flatMap((group) => group.tokens)
					.map(
						(token) =>
							`<span class="legend-chip" data-legend="${token}"><i style="background:${resolved[token].hex}"></i>${token} <b>${resolved[token].ref}</b></span>`,
					)
					.join("");
			};

			const renderExamples = (palette, scheme) =>
				["light", "dark"]
					.map((mode) => {
						const tokens = resolveCss(palette, scheme, mode);
						return `
							<div class="mode-group" data-mode="${mode}">
								<div class="mode-label">${mode} mode · ${scheme.label}</div>
								<div class="example-grid" style="${cssVars(tokens, mode)}">
									${mobileMockup()}
									<div class="web-scroll">${webMockup()}</div>
								</div>
								<div class="token-legend">${renderLegend(palette, scheme, mode)}</div>
							</div>`;
					})
					.join("");

			//==================================================
			// Page
			//==================================================

			scheme.label = scheme.name;

			const renderPage = () => {
				const source = palette;
				document.title = `${source.name} · ${scheme.name}`;
				document.querySelector("#palette-title").textContent = source.name;
				document.querySelector("#palette-description").textContent = source.description;
				const onSeedHex = source.onSeed;
				const onSeedLabel = onSeedHex === "#FFFFFF" ? "white" : "N12";
				document.querySelector("#palette-meta").innerHTML = `
					<span class="seed" style="--seed-color:${source.seed}"><span class="seed-swatch" aria-hidden="true"></span>Seed ${source.seed} · on-seed text ${onSeedLabel} (${contrast(source.seed, onSeedHex).toFixed(2)} | Lc ${Math.round(apca(onSeedHex, source.seed))}) · Gray ${source.gray}</span>
				`;
				document.querySelector("#selection-badge").innerHTML = `<span>Scheme</span><strong>${scheme.name}</strong>`;

				document.querySelector("#scheme-detail").innerHTML = `
					<h2>${scheme.name}</h2>
					<div class="influences">${scheme.influences}</div>
					<p>${scheme.summary}</p>
				`;

				const failures = [];
				let passed = 0;
				let total = 0;
				for (const mode of ["light", "dark"]) {
					const results = runChecks(resolveScheme(source, scheme, mode), mode);
					for (const [token, checks] of Object.entries(results)) {
						for (const check of checks) {
							if (check.pass === null) continue;
							total += 1;
							if (check.pass) {
								passed += 1;
								continue;
							}
							failures.push({ token, mode, ...check });
						}
					}
				}
				const failed = total - passed;
				const tone = failed === 0 ? "good" : failed <= 3 ? "ok" : "bad";
				const note =
					failed === 0
						? "All required checks passed in light and dark mode."
						: `${failed} required ${failed === 1 ? "check" : "checks"} failed.`;
				document.querySelector("#check-summary").innerHTML = `
					<span class="score ${tone}">${passed}/${total}</span>
					<p class="check-note">${note}</p>
				`;
				const failureMount = document.querySelector("#check-failures");
				if (failed === 0) {
					failureMount.innerHTML = "";
				} else {
					const failureRows = failures
						.map((check) => {
							const required = [`${check.minimum}:1`, check.apcaMinimum ? `Lc ${check.apcaMinimum}` : ""]
								.filter(Boolean)
								.join(" · ");
							return `<tr><td>${check.token}</td><td>${check.mode}</td><td>${check.against}</td><td>${check.ratio.toFixed(2)}</td><td>${Math.round(check.lc)}</td><td>${required}</td></tr>`;
						})
						.join("");
					failureMount.innerHTML = `
						<div class="matrix-shell">
							<table class="matrix checks">
								<thead><tr><th>Token</th><th>Mode</th><th>Against</th><th>WCAG 2</th><th>APCA Lc</th><th>Required</th></tr></thead>
								<tbody>${failureRows}</tbody>
							</table>
						</div>
					`;
				}

				// Each cell is painted in the resolved color for that mode (alpha steps as seen on their
				// ground), with the ref and the HEX value.
				const mappingByMode = Object.fromEntries(["light", "dark"].map((mode) => [mode, resolveScheme(source, scheme, mode)]));
				const mappingCell = (token, mode) => {
					const { ref, css, hex } = mappingByMode[mode][token];
					const textColor = contrast(hex, "#000000") >= contrast(hex, "#FFFFFF") ? "#000000" : "#FFFFFF";
					const alpha = css.length > 7 ? `<small class="ref-alpha">alpha ${css.toUpperCase()}</small>` : "";
					return `<td class="ref-pair ref-color" style="background:${hex};color:${textColor}"><b>${ref}</b><span class="ref-hex">${hex}</span>${alpha}</td>`;
				};
				const mappingRows = tokenGroups
					.map((group) => {
						const groupRows = group.tokens
							.map((token) => `<tr><td>${token}</td>${mappingCell(token, "light")}${mappingCell(token, "dark")}</tr>`)
							.join("");
						return `<tr class="group-row"><td colspan="3">${group.label}</td></tr>${groupRows}`;
					})
					.join("");
				document.querySelector("#scheme-matrix").innerHTML = `
					<thead><tr><th>Token</th><th>Light</th><th>Dark</th></tr></thead>
					<tbody>${mappingRows}</tbody>
				`;

				const rampTables = (title, seed, backgrounds, solid, alpha, wide, wideAlpha) => {
					let tables =
						renderRampTable({
							title,
							seed,
							backgrounds,
							tableClass: "ramp-table",
							columns: rampColumns(solid, source, backgrounds),
						}) +
						renderRampTable({
							title: `${title} alpha`,
							seed,
							backgrounds,
							tableClass: "ramp-table",
							kind: "alpha",
							columns: rampColumns(alpha, source, backgrounds),
						});

					if (wide && wideAlpha) {
						tables +=
							renderRampTable({
								title: `${title} wide gamut`,
								seed,
								backgrounds,
								tableClass: "ramp-table",
								kind: "wide",
								columns: rampColumns(wide, source, backgrounds),
							}) +
							renderRampTable({
								title: `${title} wide gamut alpha`,
								seed,
								backgrounds,
								tableClass: "ramp-table",
								kind: "wide",
								columns: rampColumns(wideAlpha, source, backgrounds),
							});
					}

					return tables;
				};
				const brandTable = rampTables(
					"Brand ramp",
					source.seed,
					source.backgrounds,
					{ light: source.ramps.lightBrand, dark: source.ramps.darkBrand },
					{ light: source.alphaRamps.lightBrand, dark: source.alphaRamps.darkBrand },
					{ light: source.wideGamutRamps.lightBrand, dark: source.wideGamutRamps.darkBrand },
					{ light: source.wideGamutAlphaRamps.lightBrand, dark: source.wideGamutAlphaRamps.darkBrand },
				);
				const neutralTable = rampTables(
					"Neutral ramp",
					source.gray,
					source.backgrounds,
					{ light: source.ramps.lightNeutral, dark: source.ramps.darkNeutral },
					{ light: source.alphaRamps.lightNeutral, dark: source.alphaRamps.darkNeutral },
					{ light: source.wideGamutRamps.lightNeutral, dark: source.wideGamutRamps.darkNeutral },
					{ light: source.wideGamutAlphaRamps.lightNeutral, dark: source.wideGamutAlphaRamps.darkNeutral },
				);
				const signalTables = source.signals
					.map((signal) =>
						rampTables(
							`${signal.name} ramp`,
							signal.seed,
							signal.backgrounds,
							signal.ramps,
							signal.alphaRamps,
							signal.wideGamutRamps,
							signal.wideGamutAlphaRamps,
						),
					)
					.join("");
				document.querySelector("#ramps").innerHTML = `${brandTable}${neutralTable}${signalTables}`;

				document.querySelector("#tokens").innerHTML = `
					<div class="ramp-table-group token-table-shell">
						<div class="ramp-table-header"><h3>Token selection · ${scheme.name}</h3></div>
						${renderTokenTable(source, scheme)}
					</div>
				`;
				document.querySelector("#examples").innerHTML = `
					<div class="examples">
						<div class="examples-header">
							<h3>Application examples</h3>
							<p class="legend-hint">Hover a token chip to outline where it is used.</p>
						</div>
						<div class="mode-examples">${renderExamples(source, scheme)}</div>
					</div>
				`;
			};


			document.addEventListener("mouseover", (event) => {
				const chip = event.target.closest("[data-legend]");
				document.querySelectorAll(".is-highlighted").forEach((element) => element.classList.remove("is-highlighted"));
				if (!chip) return;
				const group = chip.closest(".mode-group");
				group
					.querySelectorAll(`[data-tok~="${chip.dataset.legend}"]`)
					.forEach((element) => element.classList.add("is-highlighted"));
			});

			renderPage();
		</script>
	</body>
</html>
